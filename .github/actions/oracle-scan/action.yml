name: "ORÁCULO Authorization Proof Scan"
description: >
  Analisa estaticamente as rotas do projeto e certifica evidência de autorização
  por sink. Política explícita: falha SOMENTE com VULNERABLE comprovado (ou, com
  fail-on: insufficient, também com INSUFFICIENT/UNVERIFIED). INSUFFICIENT e
  NOT_ANALYZED NUNCA são tratados como seguros — são sempre reportados.
inputs:
  path:
    description: "Caminho do projeto a analisar"
    required: false
    default: "."
  rls:
    description: "Diretório com corpus SQL (migrações) para evidência RLS"
    required: false
    default: ""
  fail-on:
    description: "Política de falha: 'vulnerable' (padrão) ou 'insufficient' (endurecida)"
    required: false
    default: "vulnerable"
  oracle-ref:
    description: "Repositório/ref do oracle-core a usar (ex.: owner/oracle-core-v1@v1.0.0)"
    required: false
    default: ""
outputs:
  report:
    description: "Caminho do relatório JSON gerado"
    value: ${{ steps.scan.outputs.report }}
runs:
  using: "composite"
  steps:
    - name: Preparar engine
      shell: bash
      run: |
        set -euo pipefail
        ORACLE_DIR="$(cd "${{ github.action_path }}/../../.." && pwd)"
        if [ ! -d "$ORACLE_DIR/node_modules/typescript" ]; then
          npm install --prefix "$ORACLE_DIR" --ignore-scripts --no-audit --no-fund
        fi
    - name: Executar ORÁCULO
      id: scan
      shell: bash
      run: |
        set -uo pipefail
        ORACLE_DIR="$(cd "${{ github.action_path }}/../../.." && pwd)"
        ARGS=( "${{ inputs.path }}" --ci )
        if [ -n "${{ inputs.rls }}" ]; then ARGS+=( --rls "${{ inputs.rls }}" ); fi
        if [ "${{ inputs['fail-on'] }}" = "insufficient" ]; then ARGS+=( --fail-on insufficient ); fi
        node "$ORACLE_DIR/core/cli.mjs" scan "${ARGS[@]}" > oracle-report.json
        rc=$?
        echo "report=oracle-report.json" >> "$GITHUB_OUTPUT"
        node "$ORACLE_DIR/core/cli.mjs" report "${{ inputs.path }}" --out oracle-proof-report.md || true
        {
          echo "## ORÁCULO — Authorization Proof Scan"
          echo ""
          echo "> Este resultado afirma somente: caminhos provados controlados, caminhos provados vulneráveis, e o que não foi possível provar. Ele nunca afirma que o sistema está seguro."
          echo ""
          echo '```'
          node -e "const r=require('./oracle-report.json'); console.log(JSON.stringify(r.summary,null,1)); console.log('total de sinks:', r.totalSinks);"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $rc
